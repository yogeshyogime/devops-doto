name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          echo "POSTGRES_DB=todo" >> .env
          echo "POSTGRES_USER=todo" >> .env
          echo "POSTGRES_PASSWORD=ci_password" >> .env

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for app to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5000/health; then
              echo "App is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become healthy"
          docker compose logs
          exit 1

      - name: Test add and list tasks
        run: |
          curl -fs -X POST http://localhost:5000/tasks -H "Content-Type: application/json" -d '{"title":"ci test"}'
          curl -fs http://localhost:5000/tasks | grep "ci test"

      - name: Stop services
        if: always()
        run: docker compose down -v